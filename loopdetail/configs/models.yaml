# Model registry. Add models in your own YAML and pass --models-yaml (entries merge/override).
# Fields:
#   hf_id              HF hub id (override with --model-path for a local copy)
#   adapter            ouro | raven | hf
#   trust_remote_code  required for Ouro / Huginn / Recurrent-*
#   n_loops_trained    loop count used in training (H3 patches at this T)
#   loops_eval         loop counts for ExpB/S1/S5 ; extrapolation_from marks loops beyond training
#   probe_loops        loops captured for A1/A2 ; h3_target_loops: single-loop patch targets
#   prompt_format      plain | chat (chat = tokenizer chat template, thinking disabled if supported)
#   module_paths       overrides of the adapter's default module paths (see ADAPTERS.md)
#   options            adapter options (raven: state_init seeded_random|zero, state_seed)
#   experiments        per-experiment overrides of configs/experiments.yaml
#   repro              true -> S2 per-loop ARC trend check

ouro-1.4b:
  hf_id: ByteDance/Ouro-1.4B
  adapter: ouro
  trust_remote_code: true
  attn_implementation: sdpa
  dtype: bfloat16
  n_loops_trained: 4
  loops_eval: [1, 2, 3, 4, 5, 6, 7, 8]
  extrapolation_from: 5
  probe_loops: [1, 2, 3, 4]
  h3_target_loops: [2, 3, 4]
  prompt_format: plain
  repro: true
  experiments:
    C: {loops: [1, 2, 3, 4]}

