huginn:
  hf_id: tomg-group-umd/huginn-0125
  adapter: raven
  trust_remote_code: true
  dtype: bfloat16
  n_loops_trained: 32          # mean recurrence during training
  loops_eval: [1, 2, 4, 8, 16, 32, 48, 64]
  # no extrapolation_from: training samples the recurrence count (mean 32, heavy tail)
  probe_loops: [1, 2, 4, 8, 16, 32]
  h3_target_loops: [2, 4, 8, 16, 32]
  prompt_format: plain
  repro: true
  options: {state_init: seeded_random, state_seed: 0}
  experiments:                 # 64-loop forwards of a 3.5B model: smaller cells than the default
    B: {contexts_per_cell: 300}
    A1: {contexts_per_cell: 200}
    H3: {contexts_per_cell: 100, head_sweep: {layers: all, heads: 8}}
    C: {loops: [1, 4, 8, 32]}

