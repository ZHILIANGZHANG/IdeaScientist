# Experiment profiles. `full` = A100 main runs, `smoke` = ~5-minute end-to-end pipeline
# check (results meaningless), `cpu_validation` = reduced real-model run used for
# CPU_VALIDATION.md. Model-specific overrides live under `experiments:` in models.yaml.

full:
  seed: 1234
  # primary families first; implicit ones are secondary (gist needs world/numeric knowledge)
  families: [box_explicit, codes_explicit, box, codes]
  levels:                          # difficulty levels; `calibrate` selects which ones run
    - {name: N4, N: 4}             # easy anchor, always kept
    - {name: N16, N: 16}
    - {name: N32, N: 32}
    - {name: N64, N: 64}
    - {name: N128, N: 128}
    - {name: N32_fill2, N: 32, fillers: 2}     # 2 neutral sentences after every fact
    - {name: N64_fill2, N: 64, fillers: 2}
    - {name: N64_far, N: 64, quartiles: [0]}   # queried fact in the first quarter (far)
    - {name: N64_conf, N: 64, labels: confusable}            # box: 3-digit labels; codes: 4 first names
    - {name: N128_conf, N: 128, labels: confusable}
    - {name: N128_conf_fill1, N: 128, labels: confusable, fillers: 1}
  contexts_per_cell: 600           # generated per (family, level); calibration uses the LAST k
  calibrate:
    families: [box_explicit, codes_explicit]
    contexts_per_level: 50
    band: [0.4, 0.9]               # keep levels whose detail accuracy (at trained T) is here
    share_with_explicit: true      # box / codes reuse the selection of their explicit sibling
  sanity:
    n_items: 160                   # S5 uses all of them: 80 per (family, info_type)
    s1_items: 24
    s3_items: 3
    s4_contexts: 40
    s4_facts_per_context: 8
    s4_min_acc: 0.9
    repro_tasks: [arc_easy, arc_challenge]
    repro_items: 500
  B:
    contexts_per_cell: {box_explicit: 500, codes_explicit: 300, box: 300, codes: 200}
    readout: capture               # capture | set (S1 checks they agree)
    knowledge_control: true        # no-context category / thousand-range knowledge per loop
  A1:
    families: [box_explicit]
    contexts_per_cell: 300
    facts_per_context: 4
    what: [k, v, hidden]
    layers: every:4+last           # 'all' | 'every:K[+last]' | [list]; layer 0 always added
    C_grid: [0.001, 0.01, 0.1, 1.0, 10.0]
    cv_folds: 5
    test_frac: 0.2
    bootstrap: 1000
    mdl: true
    probe_backend: torch           # torch (batched, CUDA if available) | sklearn
  A2:
    families: [box_explicit, box]
    contexts_per_cell: 150
    layers: all
    reps: [hidden, v]
  H3:
    families: [box_explicit, box]
    contexts_per_cell: 150
    layer_sweep: true
    head_sweep: {layers: every:4, heads: 4}
  C:
    n_items: 300
    max_new_tokens: 512
    n_shots: 4
    annotate_n: 100
    path: null                     # local GSM8K dir/jsonl; null -> HF openai/gsm8k

smoke:
  seed: 1234
  families: [box_explicit, codes_explicit, box]
  levels:
    - {name: N4, N: 4}
    - {name: N8_fill1, N: 8, fillers: 1}
  contexts_per_cell: 26
  calibrate: {families: [box_explicit, codes_explicit], contexts_per_level: 6, band: [0.4, 0.9]}
  sanity:
    n_items: 12
    s1_items: 4
    s3_items: 2
    s4_contexts: 20
    s4_facts_per_context: 8
    s4_min_acc: 0.9
    repro_tasks: [arc_easy]
    repro_items: 20
  B: {contexts_per_cell: 16, readout: capture, knowledge_control: true}
  A1:
    families: [box_explicit]
    contexts_per_cell: 20
    facts_per_context: 4
    what: [k, v, hidden]
    layers: all
    C_grid: [0.1, 1.0]
    cv_folds: 2
    test_frac: 0.25
    bootstrap: 50
    mdl: true
  A2: {families: [box_explicit], contexts_per_cell: 4, layers: all, reps: [hidden, v]}
  H3:
    families: [box_explicit]
    contexts_per_cell: 3
    layer_sweep: true
    head_sweep: {layers: [0], heads: 2}
  C:
    n_items: 3
    max_new_tokens: 24
    n_shots: 1
    annotate_n: 4
    path: null

cpu_validation:                    # reduced real-model run for CPU_VALIDATION.md (~45 CPU-min)
  seed: 1234
  families: [box_explicit, box]
  levels:                          # N32..N128 plain levels were all at detail 1.00 in a first pass
    - {name: N4, N: 4}
    - {name: N128, N: 128}
    - {name: N64_conf, N: 64, labels: confusable}
    - {name: N128_conf, N: 128, labels: confusable}
    - {name: N128_conf_fill1, N: 128, labels: confusable, fillers: 1}
  contexts_per_cell: 40
  calibrate:
    families: [box_explicit]
    contexts_per_level: 12
    band: [0.4, 0.9]
  sanity:
    n_items: 24
    s1_items: 6
    s3_items: 2
    s4_contexts: 40
    s4_facts_per_context: 8
    s4_min_acc: 0.9
  B:
    families: [box_explicit, box]
    contexts_per_cell: 16
    readout: set
    knowledge_control: true
